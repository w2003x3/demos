<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>路網連連看</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/signs-drive.css">
</head>

<body>
    <div id="app" class="layout">
        <!-- 頂列 -->
        <header class="topbar">
            <div class="brand">
                <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="15" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="5" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="15" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5.5 12.8 8.6 7.3M11.4 7.3l3.1 5.5" stroke="currentColor" stroke-width="2"/></svg>
                <span>路網連連看</span>
            </div>
            <input id="project-name" class="project-name" spellcheck="false" title="專案名稱">
            <span id="save-status" class="save-status">已自動儲存</span>
            <span id="sim-badge" class="sim-badge" hidden>▣ 營運模擬中・唯讀</span>
            <div class="topbar-spacer"></div>
            <button id="btn-undo" class="icon-btn" title="復原 (Ctrl+Z)" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button id="btn-redo" class="icon-btn" title="重做 (Ctrl+Y)" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <div class="dropdown" id="dd-basemap">
                <button class="btn" data-dd-toggle>
                    <svg width="16" height="16" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 3v15M15 6v15" stroke="currentColor" stroke-width="2"/></svg>
                    <span id="basemap-label">底圖</span><span class="caret"></span>
                </button>
                <div class="dd-menu" id="basemap-menu"></div>
            </div>
            <div class="dropdown" id="dd-file">
                <button class="btn" data-dd-toggle>檔案<span class="caret"></span></button>
                <div class="dd-menu dd-right">
                    <button data-action="new">新專案</button>
                    <button data-action="presets">載入預設路網…</button>
                    <div class="dd-sep"></div>
                    <button data-action="open">讀取 JSON…<kbd>Ctrl+O</kbd></button>
                    <button data-action="save">下載 JSON<kbd>Ctrl+S</kbd></button>
                    <div class="dd-sep"></div>
                    <button data-action="signs">指標設計…</button>
                    <div class="dd-sep"></div>
                    <button data-action="simulate">營運模擬(唯讀)</button>
                    <button data-action="drive">駕駛模式(3D)…</button>
                </div>
            </div>
            <button id="btn-sim-exit" class="btn" hidden>結束模擬 <kbd>Esc</kbd></button>
            <button id="btn-signs" class="btn" title="設計站名牌、方向指標、柱面站名、系統標誌與車站圖示">
                <svg width="16" height="16" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 14v6M8 20h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6.5 9.5h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                指標設計
            </button>
            <button id="btn-drive" class="btn" title="在 3D 駕駛艙內依路網圖的路線駕駛列車">
                <svg width="16" height="16" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 10h14" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="13.5" r="1" fill="currentColor"/><circle cx="15" cy="13.5" r="1" fill="currentColor"/><path d="m8 21 2-4m6 4-2-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                駕駛
            </button>
            <button id="btn-export" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                匯出圖片
            </button>
        </header>

        <!-- 工具欄 -->
        <nav class="toolrail" id="toolrail">
            <button class="tool" data-tool="select" title="選取 (V)">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="m5 3 14 7-6 2-2 6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><kbd>V</kbd>
            </button>
            <button class="tool" data-tool="station" title="車站 (S):點空白處建立車站">
                <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2.4"/></svg><kbd>S</kbd>
            </button>
            <button class="tool" data-tool="line" title="路線 (L):連連看繪製/延伸路線">
                <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="5" cy="17" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="19" cy="7" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 15.5 11 10h6" fill="none" stroke="currentColor" stroke-width="2"/></svg><kbd>L</kbd>
            </button>
            <button class="tool" data-tool="corridor" title="連通道 (C):依序點兩站">
                <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="19" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 12h7" stroke="currentColor" stroke-width="2" stroke-dasharray="2 2"/></svg><kbd>C</kbd>
            </button>
            <div class="rail-sep"></div>
            <button class="tool" data-cmd="fit" title="全部適配 (F)">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><kbd>F</kbd>
            </button>
            <div class="rail-spacer"></div>
            <button class="tool" data-cmd="help" title="快捷鍵說明 (?)">
                <svg width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
        </nav>

        <!-- 左側清單 -->
        <aside class="sidelist" id="sidelist"></aside>

        <!-- 地圖 -->
        <main class="map-area">
            <div id="map"></div>
            <div id="hud" class="hud" hidden></div>
            <div id="hint-bar" class="hint-bar" hidden></div>
            <div id="segment-bar" class="segment-bar" hidden></div>
            <div id="cursor-tip" class="cursor-tip" hidden></div>
            <div id="box-select" class="box-select" hidden></div>
            <div id="sim-panel" class="sim-panel" hidden></div>
            <div id="sim-legend" class="sim-legend" hidden>
                <span class="sl-title">圖例</span>
                <span><svg width="26" height="12" viewBox="0 0 26 12"><rect x="1" y="1" width="24" height="10" rx="5" fill="#5F6168"/><path d="M15 3.5 19 6 15 8.5" fill="none" stroke="#fff" stroke-width="1.6"/></svg>列車(前端=行進方向)</span>
                <span>滑鼠停在列車上看往哪裡與下一站</span>
            </div>
        </main>

        <!-- 屬性面板 -->
        <aside class="inspector" id="inspector"></aside>

        <!-- 狀態列 -->
        <footer class="statusbar">
            <span id="st-tool" class="st-tool">選取 <kbd>V</kbd></span>
            <span id="st-selection" class="st-sel"></span>
            <span class="st-spacer"></span>
            <span id="st-hint" class="st-hint"></span>
            <span id="st-coords" class="st-mono">--</span>
            <span id="st-zoom" class="st-mono">Z--</span>
        </footer>
    </div>

    <div id="toast-host" class="toast-host"></div>
    <div id="modal-host"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 駕駛模式的 3D 引擎(進入駕駛模式時才動態載入);版本與「火車便當」專案一致 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
