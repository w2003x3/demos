<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Route Map Editor V2</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- App CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="app">
        <div id="map"></div>

        <!-- Simply UI Overlay -->
        <div id="ui-layer">
            <div class="toolbar">
                <button id="btn-select" class="tool-btn active" data-tool="select">👆 選取</button>
                <button id="btn-station" class="tool-btn" data-tool="station">📍 新增車站</button>
                <button id="btn-line" class="tool-btn" data-tool="line">🚇 新增路線</button>
                <div class="separator"></div>
                <button id="btn-undo" title="復原 (Ctrl+Z)" disabled>↶</button>
                <button id="btn-redo" title="重做 (Ctrl+Y)" disabled>↷</button>
                <div class="separator"></div>
                <button id="btn-toggle-map">🗺️ 切換底圖</button>
                <input type="color" id="bg-color-picker" value="#ebf0f5" style="display: none; height: 32px; width: 32px; cursor: pointer; border: none; padding: 0; background: none; vertical-align: middle;" title="自訂無底圖背景色">
                <button id="btn-route-list">📃 行駛區間</button>
                <div class="separator"></div>
                <button id="btn-export">📸 匯出圖片</button>
                <div class="separator"></div>
                <button id="btn-save">💾 儲存</button>
                <button id="btn-load">📂 讀取</button>
            </div>

            <div class="status-bar">
                <span id="active-line-text">當前路線：無</span>
                <span id="status-text">就緒</span>
                <span id="coords-text">Lat: 0, Lng: 0</span>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- dom-to-image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>

    <!-- App Modules (ESM) -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
